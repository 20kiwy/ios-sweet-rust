name: rust

# Build + test the sweet-rust workspace on all three OSes and attach the
# release binaries to every run (and to GitHub releases on tags).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: sweet-rust
          - os: macos-14
            target: aarch64-apple-darwin
            bin: sweet-rust
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: sweet-rust.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # cargo registry + target cache: the vendored C deps (miniz/lzfse/
      # libzbitmap) dominated a full ~3-5 min rebuild per OS per push.
      - name: Cache cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Smoke test (help + demo pipeline, no QEMU needed)
        shell: bash
        run: |
          ./target/release/${{ matrix.bin }} --version
          ./target/release/${{ matrix.bin }} demo-kernel /tmp/dk.macho
          ./target/release/${{ matrix.bin }} make-adt /tmp/q.adt --qemu --phys 0x48000000 --mem 0x70000000
          ./target/release/${{ matrix.bin }} make-payload /tmp/dk.macho /tmp/q.adt /tmp/payload.bin \
            --cmdline 'debug=0xc serial=3 cpus=1 rd=md0'
          ls -l /tmp/payload.bin

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sweet-rust-${{ matrix.target }}
          path: target/release/${{ matrix.bin }}
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/sweet-rust*
