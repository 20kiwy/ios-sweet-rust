name: qemu-logo

# The full ios-sweet-rust boot test on a GitHub runner:
#   real iPhone X 16.7.16 IPSW (HTTP range requests, no full download)
#     -> Apple logo asset -> SWEETXNU payload (demo kernel)
#     -> QEMU virt boot -> fb.png screenshot -> verdict (must pass)
#   then a second boot that ends on the iOS "Hello" welcome screen rendered
#     from the REAL CursiveHello.json vector data pulled out of the IPSW's
#     sealed system volume (APFS + decmpfs in Rust; hello_visible must be
#     true and the JSON sha256 lands in the verdict for provenance).
#
# The demo kernel is synthetic (the real SWEET xnu needs the upstream xnu.yml
# macOS build); the LOGO, the ADT, the payload pipeline and the QEMU boot are
# the real thing, end to end.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/qemu-logo.yml"
  workflow_run:
    workflows: [rust]
    types: [completed]

concurrency:
  group: qemu-logo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boot:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # cargo registry + target cache — skip the full vendored-C rebuild
      - name: Cache cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-arm
          qemu-system-aarch64 --version | head -1

      - name: Boot the Apple logo from the real 16.7.16 IPSW
        run: |
          IPSW_URL=$(curl -sfL 'https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw' \
            | jq -r '.firmwares[] | select(.version=="16.7.16") | .url')
          echo "IPSW_URL=$IPSW_URL" | tee -a "$GITHUB_ENV"
          ./target/release/sweet-rust ipsw-boot --ipsw "$IPSW_URL" out \
            --demo --lowmem --secs 30 --live-serial

      - name: Verdict (must pass)
        run: |
          cat out/boot-verdict.json
          python3 - <<'EOF'
          import json, sys
          v = json.load(open('out/boot-verdict.json'))
          ok = v['pass'] and v['logo_visible'] and not v['panic']
          print('PASS' if ok else 'FAIL', '- logo_visible:', v['logo_visible'],
                'kernel_ran:', v['demo_marker'], 'panic:', v['panic'])
          sys.exit(0 if ok else 1)
          EOF

      - name: Download the IPSW once (hello needs rootfs chunks; runners have the bandwidth)
        # cached: same path+key as qemu-m3-rootfs.yml — ONE shared 6.6 GB
        # entry for the repo (two entries would exceed the 10 GB cache
        # total and LRU-evict each other)
        uses: actions/cache@v4
        with:
          path: ipsw.ipsw
          key: ipsw-20H392-iPhone10,3

      - name: Fetch the IPSW if the cache missed
        run: |
          if [ ! -s ipsw.ipsw ]; then
            curl -fL --retry 5 --retry-delay 10 -o ipsw.ipsw.tmp "$IPSW_URL" \
              && mv ipsw.ipsw.tmp ipsw.ipsw
          else
            echo "IPSW cache hit ($(du -h ipsw.ipsw | cut -f1))"
          fi
          ls -la ipsw.ipsw

      - name: Boot to the real Hello welcome screen (IPSW CursiveHello.json)
        run: |
          ./target/release/sweet-rust ipsw-boot --ipsw ipsw.ipsw out-hello \
            --hello --lowmem --secs 30

      - name: Hello verdict (must pass)
        run: |
          cat out-hello/boot-verdict.json
          python3 - <<'EOF'
          import json, sys
          v = json.load(open('out-hello/boot-verdict.json'))
          ok = (v['pass'] and v.get('hello_visible') and not v['panic']
                and 'CursiveHello.json' in v.get('hello_source', '')
                and len(v.get('hello_sha256', '')) == 64)
          print('PASS' if ok else 'FAIL', '- hello_visible:', v.get('hello_visible'),
                'detection:', v.get('hello_detection'),
                'source:', v.get('hello_source'), 'sha256:', v.get('hello_sha256'))
          sys.exit(0 if ok else 1)
          EOF

      - name: Compose the real IPSW wallpaper (Clownfish HEIC layers + Apple CAML)
        run: |
          pip install pillow-heif
          mkdir -p wall
          B="/Library/Wallpaper/Collections/Clownfish~iphone.wallpaperCollection/Wallpapers/7420.Clownfish-375w-812h@3x~iphone.wallpaper"
          for a in \
            "7420.Clownfish_Background-375w-812h@3x~iphone.ca/assets/Background.HEIC" \
            "7420.Clownfish_Foreground-375w-812h@3x~iphone.ca/assets/Foreground.HEIC" \
            "7420.Clownfish_Foreground-375w-812h@3x~iphone.ca/assets/Foreground_Upper.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_One.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_Two.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_Three.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_Four.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_Five.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_Six.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_One_Left.HEIC" \
            "7420.Clownfish_Floating-375w-812h@3x~iphone.ca/assets/Float_One_Right.HEIC" ; do
            n=$(basename "$a")
            ./target/release/sweet-rust ipsw-file ipsw.ipsw "$B/$a" --out "wall/$n"
          done
          # the three CAML layout docs share the basename main.caml — name
          # them per doc or they overwrite each other (compose-wallpaper.py
          # looks for Background/Floating/Foreground.main.caml)
          for d in Background Floating Foreground; do
            ./target/release/sweet-rust ipsw-file ipsw.ipsw \
              "$B/7420.Clownfish_${d}-375w-812h@3x~iphone.ca/main.caml" \
              --out "wall/$d.main.caml"
          done
          python3 tools/compose-wallpaper.py wall
          ls -la wall/*.png

      - name: LIVE control run (boot -> paint wallpaper -> type into the guest)
        run: |
          ./target/release/sweet-rust emu-boot --ipsw ipsw.ipsw out-emu \
            --wallpaper wall/clownfish-1080x2400.png \
            --send "hello from the host" --secs 30

      - name: Control verdict (must pass)
        run: |
          cat out-emu/emu-verdict.json
          python3 - <<'EOF'
          import json, sys
          v = json.load(open('out-emu/emu-verdict.json'))
          ok = (v['pass'] and v['logo_visible'] and v['wallpaper_visible']
                and v['input_echoed'] and v['input_visible']
                and len(v.get('wallpaper_sha256', '')) == 64)
          print('PASS' if ok else 'FAIL', '- wallpaper:', v['wallpaper_visible'],
                'input_echoed:', v['input_echoed'], 'input_visible:', v['input_visible'])
          sys.exit(0 if ok else 1)
          EOF

      - name: Artifacts (screenshots + verdicts + payload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-results
          path: |
            out/
            out-hello/
            out-emu/
            wall/clownfish-1080x2400.png
          retention-days: 30
