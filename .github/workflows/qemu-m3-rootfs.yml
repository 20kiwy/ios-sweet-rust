name: qemu-m3-rootfs

# M3: boot the REAL iOS userland toward launchd.
#   real iPhone X 16.7.16 IPSW
#     -> SystemOS cryptex extracted (holds the dyld shared cache)
#     -> mini HFS+ root built root-free by our own writer (mkiosroot parity:
#        DSC + launchd + dyld + LaunchDaemons + xpc + /usr + /sbin + /private/etc
#        + SWEET additions), fsck_hfs-validated
#     -> SWEETXNU payload (kernel.development.sweet + highmem ADT + root as md0)
#     -> QEMU virt, upstream boot-args (rd=md0 ignition_level=1
#        launchd_unsecure_cache=1 unentitled_ios_sim_launch=1 rootrw=1 ...)
#     -> fb.png decoded back to console text via the kernel's own _iso_font
#
# Honesty: this boots Apple's launchd from Apple's files; everything the
# console prints is real guest output. The runner has 16 GB RAM; the local
# sandbox cannot hold a ~3.3 GB md0 (that is why the boot lives here).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "kernel/**"
      - ".github/workflows/qemu-m3-rootfs.yml"

concurrency:
  group: qemu-m3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  m3-mini-root:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust, QEMU, llvm-nm, fsck
        run: |
          # free runner disk first: the pipeline writes cryptex (2.7GB) +
          # mini-root (4.2GB) + payload (4.2GB); preinstalled dotnet/android/
          # ghc eat ~10GB of the 14GB free disk and killed a boot mid-run
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-arm llvm
          qemu-system-aarch64 --version | head -1

      - name: Build + unit tests
        run: |
          cargo build --release
          cargo test --release
          (cd kernel && sha256sum -c SHA256SUMS)

      - name: Resolve the IPSW URL
        run: |
          IPSW_URL=$(curl -sfL 'https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw' \
            | jq -r '.firmwares[] | select(.version=="16.7.16") | .url')
          echo "IPSW_URL=$IPSW_URL" | tee -a "$GITHUB_ENV"

      - name: Extract the SystemOS cryptex (dyld shared cache source)
        run: |
          ./target/release/sweet-rust ipsw-extract "$IPSW_URL" \
            --member 087-86593-047.dmg --out cryptex
          ./target/release/sweet-rust ipsw-extract "$IPSW_URL" \
            --member DeviceTree.d22ap.im4p --out dt
          ls -la cryptex dt
          # diagnostic: the full dyld cache directory of the cryptex —
          # the dyld "Library not loaded: /usr/lib/libSystem.B.dylib" wall
          # needs the real file list (main cache, subcaches, companions)
          ./target/release/sweet-rust ipsw-ls cryptex/087-86593-047.dmg \
            /System/Library/Caches/com.apple.dyld || true

      - name: Build the mini HFS+ root (real files, root-free writer)
        run: |
          ./target/release/sweet-rust mkiosroot \
            --os "$IPSW_URL" \
            --systemos cryptex/087-86593-047.dmg \
            --unlink-systemos \
            --profile mini \
            --out mini-root.img

      - name: fsck gate (no structural errors; hard-link overlaps reported)
        run: |
          FSCK=$(find / -name fsck.hfsplus -path "*sbin*" 2>/dev/null | head -1 || true)
          if [ -z "$FSCK" ]; then
            # hfsprogs was removed from Debian; pull the Ubuntu universe binary
            curl -sfL -o /tmp/hfsprogs.deb \
              http://archive.ubuntu.com/ubuntu/pool/universe/h/hfsprogs/hfsprogs_540.1.linux3-6_amd64.deb
            dpkg -x /tmp/hfsprogs.deb /tmp/hfstools
            FSCK=$(find /tmp/hfstools -name fsck.hfsplus | head -1)
          fi
          set +e
          "$FSCK" -f -n mini-root.img | tee fsck.log
          rc=$?
          set -e
          invalid=$(grep -cE "Invalid|Incorrect|should be" fsck.log || true)
          overlaps=$(grep -c "Overlapped" fsck.log || true)
          echo "fsck rc=$rc invalid=$invalid overlaps=$overlaps" | tee fsck-summary.txt
          # structural errors are fatal; shared extents of the SOURCE volume's
          # own hard links are expected and documented (upstream parity)
          test "$invalid" -eq 0

      - name: Boot md0 = mini-root with the real SWEET kernel (highmem)
        # ncl=49152 pins the mbuf pool to the 96MB table row (mem < 4GB).
        # The 4GiB highmem bank crosses xnu's ncl_table into the 128MB row,
        # and this DEVELOPMENT kernel VERIFY-panics in mbinit
        # (uipc_mbuf.c:1743 m_total(MC_BIGCL)==0 && m_minlimit!=0) with the
        # larger pool. 49152 clusters is exactly what the launchd-reaching
        # boots computed; revisit the >=4GB mbinit path as its own item.
        #
        # --msgbuf-dump: fb.txt is only the LAST console screen; the kernel's
        # msgbuf ring holds everything printed before the panic. llvm-nm
        # gives _msgbufp (static, dev kernels do not slide); the runner
        # walks msgbufp -> struct -> bufc and memsave's 128 KiB to
        # msgbuf.bin (upstream NOTES.md boot-0038 trick, now native).
        run: |
          MSGREF=$(llvm-nm kernel/kernel.development.sweet | grep ' _msgbufp$' | awk '{print $1}')
          echo "_msgbufp = 0x$MSGREF"
          ./target/release/sweet-rust ipsw-boot --ipsw "$IPSW_URL" out-m3 \
            --kernel kernel/kernel.development.sweet \
            --ramdisk mini-root.img \
            --product dt/Firmware_all_flash_DeviceTree.d22ap.im4p \
            --highmem --no-logo --secs 240 --dump-ramdisk \
            --snap-every 5 \
            --msgbuf-dump "0x$MSGREF" \
            --cmdline 'debug=0xc serial=3 cpus=1 keepsyms=1 -enable_kprintf_spam -noprogress rd=md0 unentitled_ios_sim_launch=1 ignition_level=1 wdt_test=no_user_checkin ufsrw=1 rootrw=1 launchd_unsecure_cache=1 wdt=-1 ncl=49152' \
            || true
          ls -la out-m3
          echo "===== msgbuf console history (head 200 lines) ====="
          head -200 out-m3/msgbuf.txt 2>/dev/null || echo "(msgbuf.txt missing)"
          echo "===== msgbuf console history (tail 60 lines — early-boot-complete lands here) ====="
          tail -60 out-m3/msgbuf.txt 2>/dev/null || echo "(msgbuf.txt missing)"

      - name: Guest-side logs (launchd + daemons, from the md0 dump)
        # The console only shows kernel panics; launchd and the daemons write
        # TEXT logs into files on the md0 ramdisk, which --dump-ramdisk
        # pmemsave's out of guest RAM before QEMU quits. Grep the raw image
        # for the log text (small ASCII files are contiguous in the image).
        if: always()
        run: |
          D=out-m3/md0-dump.img
          if [ -f "$D" ]; then
            ls -la "$D"
            # launchd + usermanagerd file logs and any panic-adjacent text
            strings -n 8 "$D" | grep -aE \
              'launchd|usermanagerd|mobile|getpwnam|libinfo|muser|keybag|persona|UIKitApplication|exit reason|unable to|failed|xpcproxy|user/501|WILL_SPAWN|Early boot complete|Successfully spawned|Missing executable|SpringBoard|backboardd' \
              > out-m3/guest-strings.txt || true
            wc -l out-m3/guest-strings.txt || true
            # the launchd log file itself is plaintext: pull its head/tail
            strings -n 8 "$D" | grep -anE 'launchd.log|boot-task|UMD_INIT|com.apple.xpc' | head -80 \
              > out-m3/guest-launchd-peek.txt || true
            tail -c 200000 "$D" | strings -n 12 > out-m3/guest-strings-tail.txt || true
          else
            echo "no md0 dump (boot exited early?)"
          fi

      - name: Decode the framebuffer console (kernel _iso_font)
        run: |
          set +e
          ./target/release/sweet-rust screen-decode \
            --kernel kernel/kernel.development.sweet \
            --payload out-m3/payload.bin \
            out-m3/fb.png > out-m3/fb.txt 2> out-m3/screen-decode.log
          rc=$?
          set -e
          echo "screen-decode rc=$rc"
          wc -c out-m3/fb.txt || true
          # the interval snapshots (fb-NNNN.png, --snap-every 20): decode each
          # to text — together they are the launchd os_log TIMELINE (the
          # single end-of-boot fb.png only holds the last console screen)
          for p in out-m3/fb-[0-9]*.png; do
            [ -f "$p" ] || continue
            t="${p%.png}.txt"
            ./target/release/sweet-rust screen-decode \
              --kernel kernel/kernel.development.sweet \
              --payload out-m3/payload.bin \
              "$p" > "$t" 2>/dev/null || true
            echo "--- $t ($(wc -c < "$t") bytes)"
          done
          cat out-m3/boot-verdict.json || true

      - name: M3 verdict (v2 — launchd-positive stages)
        # Run 40018794158 (2026-10-23) redefined success: with the symlink fix,
        # Apple's real launchd COMPLETED EARLY BOOT ([System Event] boot:
        # "Early boot complete. Continuing system boot.", msgbuf 33.15s) and
        # the fbcon flooded with its os_log user-domain spawn cycle
        # (user/501: SpringBoard, tccd — every spawn dying on the missing
        # /usr/libexec/xpcproxy trampoline). The kernel messages (BSD root:
        # md0) scrolled off the LAST fb screen, and the launchd os_log mirror
        # writes straight to the fbcon WITHOUT entering the kernel msgbuf —
        # so the two windows are complementary and must be read together:
        #   fb.txt    = last console screen  = the live launchd log tail
        #   msgbuf.txt= 128 KiB kernel ring  = boot up to early-boot-complete
        # Stages, best first:
        #   user-domain        fb shows launchd spawning in user/501
        #   launchd-early-boot msgbuf shows "Early boot complete"
        #   launchd-exec       msgbuf shows "exec launchd" (no completion)
        #   mounted            BSD root: md0 seen, no launchd yet
        #   kernel-panic       panic before launchd exec'd
        #   booting/early      not enough signal yet
        run: |
          tail -40 out-m3/fb.txt 2>/dev/null || true
          python3 - <<'EOF'
          import glob, json, re, sys
          v = json.load(open('out-m3/boot-verdict.json'))
          def read(p):
              try:
                  return open(p, errors='replace').read()
              except OSError:
                  return ''
          fb, mb = read('out-m3/fb.txt'), read('out-m3/msgbuf.txt')
          # the interval snapshots: the launchd log TIMELINE (fb.txt is only
          # the last console screen)
          snaps = ''.join(read(p) for p in sorted(glob.glob('out-m3/fb-*.txt')))
          fb_flat = re.sub(r'\s+', ' ', fb + '\n' + snaps)
          mb_flat = re.sub(r'\s+', ' ', mb)
          both = fb_flat + ' || ' + mb_flat
          # the fbcon wraps at ~54 columns, often mid-word: match on FLATTENED text
          execd_launchd = 'exec launchd' in both
          early_boot = 'Early boot complete' in both
          user_domain = 'user/501' in fb_flat
          spawn_cycle = 'WILL_SPAWN' in fb_flat or 'service state: spawning' in fb_flat
          initproc = 'initproc' in both or 'exit reason namespace' in both
          kernel_panic = bool(re.search(r'panic\(cpu|SWEET EARLY PANIC', both)) or v.get('panic')
          stage = ('early' if not (fb or mb) else
                   'kernel-panic' if (kernel_panic and not execd_launchd) else
                   'user-domain' if (user_domain and spawn_cycle) else
                   'launchd-early-boot' if early_boot else
                   'launchd-exec' if execd_launchd else
                   'mounted' if 'BSD root: md0' in both else 'booting')
          # launchd's own exit reason names the next wall verbatim (if it died)
          m = re.search(r'description:\s*(.{0,140}?)(?:handshake|Please go to|$)', both)
          exit_reason = m.group(1).strip() if m else ''
          mount_proven = 'BSD root: md0' in both or initproc or early_boot
          print(f"stage={stage} exit_reason='{exit_reason}' early_boot={early_boot} user_domain={user_domain} spawn_cycle={spawn_cycle}")
          json.dump({'stage': stage, 'exit_reason': exit_reason,
                     'early_boot': early_boot, 'user_domain': user_domain,
                     'spawn_cycle': spawn_cycle, 'stdin_devnull': 'reserve stdin descriptor' in both,
                     'mount_proven': mount_proven,
                     'pass': stage in ('mounted', 'launchd-exec', 'launchd-early-boot', 'user-domain')},
                    open('out-m3/m3-verdict.json', 'w'), indent=1)
          # M3 gate: the real rootfs mounts as md0 AND the real launchd execs
          # (early-boot-complete or user-domain spawning is the proven state);
          # a kernel-stage panic still fails the gate.
          ok = mount_proven and execd_launchd and not (kernel_panic and not execd_launchd)
          sys.exit(0 if ok else 1)
          EOF

      - name: "Artifacts - fb, console text, verdicts, fsck, guest logs (images excluded)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-mini-root-boot
          path: |
            out-m3/fb.png
            out-m3/fb.txt
            out-m3/fb-*.png
            out-m3/fb-*.txt
            out-m3/msgbuf.bin
            out-m3/msgbuf.txt
            out-m3/boot-verdict.json
            out-m3/m3-verdict.json
            out-m3/qemu.log
            out-m3/screen-decode.log
            out-m3/guest-strings.txt
            out-m3/guest-launchd-peek.txt
            out-m3/guest-strings-tail.txt
            fsck.log
            fsck-summary.txt
          retention-days: 30
